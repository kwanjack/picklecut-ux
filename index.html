<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PickleCut UX</title>
<style>
  html,body{margin:0;background:#0a0a0c;-webkit-font-smoothing:antialiased;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Helvetica,Arial,sans-serif;}
  a{color:#0a84ff;text-decoration:none;}
</style>
</head>
<body>
<div id="root">Loading mock…</div>
<script>
(async () => {
  const parts = ['part1.html', 'part2.html', 'part3.html', 'part4.html', 'part5.html'];
  const texts = await Promise.all(parts.map(u => fetch(u).then(r => r.text())));
  document.getElementById('root').outerHTML = texts.join('');
})().catch(err => { document.body.textContent = 'Failed to load: ' + err; });
</script>
</body>
</html>
